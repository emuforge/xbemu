# cargo-deny policy for the crates xbemu ships: `cargo deny check`.
#
# Every crate's license has to be compatible with GPL-3.0-or-later (AGENTS.md,
# "Lineage and license"), crates.io is the only source, and the RustSec
# advisories are enforced. The vendored C under vendor/ is not a crate and is
# accounted for in ATTRIBUTION.md.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# Dev-dependencies build the tests only and ship in nothing.
exclude-dev = true

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
