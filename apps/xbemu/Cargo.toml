[package]
name = "xbemu"
description = "Standalone xbemu front end: window, gamepads, audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xb-core = { path = "../../crates/xb-core" }
log = "0.4.29"
winit = "0.30.13"
ash = "0.38.0"
ash-window = "0.13.0"
gilrs = "0.11.2"
cpal = "0.18.2"

# MIT OR Apache-2.0 (already in the tree through ash-window). The window's
# CAMetalLayer, made on the main thread as AppKit requires (surface.rs).
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "0.4.0"
# MIT. The Open panel that asks for a disc when the app is started without
# one (picker.rs); version 0.3 of the bindings winit uses, whose panel calls
# are safe.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication"] }
# Zlib OR Apache-2.0 OR MIT. The gamepads on macOS (pads/macos.rs): Apple's
# drivers feed this framework, and some pads (an Xbox pad on USB) can be
# read through nothing else.
objc2-game-controller = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-haptics", "GCController", "GCDevice", "GCDeviceHaptics", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput"] }
# Zlib OR Apache-2.0 OR MIT. Rumble on macOS (pads/macos/haptics.rs): the
# GameController framework drives a pad's motors through Core Haptics.
objc2-core-haptics = { version = "0.3.2", default-features = false, features = ["std", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }

# PipeWire and PulseAudio desktops are reached through cpal's PulseAudio host
# (a Rust implementation of the protocol; no system library). Their ALSA
# "default" device is often the bare hardware, which the sound server holds.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
