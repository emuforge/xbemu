name: CI

# The checks on every pull request and every push to main, and, on main, the
# pre-release of that commit (docs/releasing.md). The checks run inside the
# toolchain container, as tools/in-container.sh runs them anywhere.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

# A newer push to a pull request supersedes its run; every commit on main is
# built, since each is a pre-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the toolchain's version
        id: rust
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker
          build-args: RUST_TOOLCHAIN=${{ steps.rust.outputs.toolchain }}
          tags: xbemu-build:ci
          load: true
          cache-from: type=gha,scope=toolchain-glibc-x86_64
          cache-to: type=gha,mode=max,scope=toolchain-glibc-x86_64

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/docker
            !target/docker/dist
          key: checks-${{ steps.rust.outputs.toolchain }}-${{ hashFiles('Cargo.lock', 'tools/fetch-deps.sh', 'docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ steps.rust.outputs.toolchain }}-${{ hashFiles('Cargo.lock', 'tools/fetch-deps.sh', 'docker/Dockerfile') }}-

      - name: Fetch the third-party sources
        env:
          XBEMU_BUILD_IMAGE: xbemu-build:ci
        run: tools/in-container.sh tools/fetch-deps.sh

      - name: Format
        env:
          XBEMU_BUILD_IMAGE: xbemu-build:ci
        run: tools/in-container.sh cargo fmt --all --check

      - name: Clippy
        env:
          XBEMU_BUILD_IMAGE: xbemu-build:ci
        run: tools/in-container.sh cargo clippy --workspace --all-targets --locked -- -D warnings

      # No game data and no GPU here: the tests that need a title or a
      # Vulkan device pass with a note (titles/README.md). The runner's KVM
      # is passed through where it has one.
      - name: Tests
        env:
          XBEMU_BUILD_IMAGE: xbemu-build:ci
        run: tools/in-container.sh cargo test --workspace --locked

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny
        # deny.toml: GPLv3-compatible licenses only, crates.io as the only
        # source, and the RustSec advisories
        run: |
          set -eu
          cargo install --locked --quiet cargo-deny
          cargo deny check

  label:
    name: Name the build
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

  linux-glibc-x86_64:
    name: Linux
    needs: label
    uses: ./.github/workflows/build-linux.yaml
    with:
      arch: x86_64
      libc: glibc
      label: ${{ needs.label.outputs.short }}

  pre-release:
    name: Publish the pre-release
    # Every platform's build joins `needs` and the check below
    needs: [label, checks, licenses, linux-glibc-x86_64]
    if: github.repository == 'emuforge/xbemu' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The files' build provenance, attested through the run's OIDC token
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "dist-*"
          path: pre-release/
          merge-multiple: true
      - name: Collect the pre-release files
        run: |
          set -e
          cd pre-release
          # Every kind of file, so a build that uploaded nothing fails here
          # rather than publishing a pre-release without it
          for want in '*-x86_64-linux-glibc.tar.gz' '*-x86_64-linux-glibc.AppImage'; do
            # shellcheck disable=SC2086  # want is the glob expanded here
            ls ${want} > /dev/null 2>&1 || { echo "::error::no ${want} in the run's artifacts"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS
          ls -la
      - name: Attest the pre-release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pre-release/*
      - name: Create the pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.label.outputs.short }}
          name: ${{ needs.label.outputs.short }}
          # A new tag at this commit rather than at the branch's head by the
          # time the builds have finished
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          make_latest: false
          files: pre-release/*
